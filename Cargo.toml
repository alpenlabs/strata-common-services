[workspace]
members = ["crates/paas", "crates/prover-core"]
resolver = "2"

[workspace.package]
authors = ["Alpen Labs <noreply@alpenlabs.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/alpenlabs/strata-common-services"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "deny"
rust.unused_must_use = "deny"
# rust.missing_docs = "warn" # TODO(STR-3693): we need to enable this in the near future
clippy.allow_attributes = "warn"
clippy.allow_attributes_without_reason = "warn"
clippy.absolute_paths = "warn"
rustdoc.all = "warn"

[workspace.dependencies]
anyhow = "1.0.102"
async-trait = "0.1.80"
parking_lot = "0.12.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.15"
strata-prover-core = { path = "crates/prover-core" }
strata-service = { git = "https://github.com/alpenlabs/strata-common", tag = "v0.4.0" }
thiserror = "2.0.11"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
zkaleido = { git = "https://github.com/alpenlabs/zkaleido", features = [
  "arbitrary",
  "ssz",
], tag = "v0.4.0" }
