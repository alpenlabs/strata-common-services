name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Check docs leaving the dependencies out
        env:
          # generic_const_exprs is not yet supported by the globally enabled next-generation trait
          # solver. See https://github.com/rust-lang/rust/issues/160895.
          RUSTDOCFLAGS: -Znext-solver=coherence -A rustdoc::private-doc-tests -D warnings
        run: cargo doc --workspace --all-features --no-deps
