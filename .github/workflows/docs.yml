name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  docs:
    name: Generate docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Check docs leaving the dependencies out
        env:
          # generic_const_exprs is not yet supported by the globally enabled next-generation trait
          # solver. See https://github.com/rust-lang/rust/issues/160895.
          RUSTDOCFLAGS: -Znext-solver=coherence -A rustdoc::private-doc-tests -D warnings
        run: cargo doc --workspace --all-features --no-deps
